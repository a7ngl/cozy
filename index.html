<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>xcozy</title>
  <style>
    @font-face {
      font-family: 'ET Book';
      src: url('/fonts/et-book-bold-line-figures.woff') format('woff');
      font-weight: bold;
      font-style: normal;
    }
    @font-face {
      font-family: 'ET Book';
      src: url('/fonts/et-book-roman-line-figures.woff') format('woff');
      font-weight: normal;
      font-style: normal;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: #ededea;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: 'ET Book', serif;
      color: #111;
    }

    .title {
      font-size: 28px;
      font-weight: bold;
      letter-spacing: 0.5px;
      margin-bottom: 32px;
    }

    .links {
      list-style: none;
      text-align: left;
    }

    .links li {
      position: relative;
      padding-left: 16px;
      margin: 6px 0;
      opacity: 0;
      transform: translateY(8px);
      animation: fadeIn 0.4s ease forwards;
    }

    .links li::before {
      content: '\2022';
      position: absolute;
      left: 0;
      color: #111;
      font-size: 14px;
    }

    .links a {
      color: #111;
      font-family: 'ET Book', serif;
      font-weight: normal;
      font-size: 18px;
      text-decoration: underline;
      text-underline-offset: 3px;
      text-decoration-thickness: 1px;
      transition: opacity 0.2s;
    }

    .links a:hover {
      opacity: 0.5;
    }

    @keyframes fadeIn {
      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .links li:nth-child(1) { animation-delay: 0.3s; }
    .links li:nth-child(2) { animation-delay: 0.45s; }
    .links li:nth-child(3) { animation-delay: 0.6s; }
    .links li:nth-child(4) { animation-delay: 0.75s; }
  </style>
</head>
<body>
  <h1 class="title">xcozy.app</h1>
  <ul class="links">
    <li><a href="/memento">Memento</a></li>
    <li>&nbsp;</li>
  </ul>
</body>
</html>
