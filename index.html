<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>xcozy</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;1,400&display=swap">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #000;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: 'ET Book', 'EB Garamond', serif;
    }
    ul {
      list-style: none;
    }
    li {
      margin: 8px 0;
    }
    a {
      color: #666;
      font-size: 14px;
      font-style: italic;
      text-decoration: underline;
      text-underline-offset: 3px;
      transition: color 0.2s;
    }
    a:hover {
      color: #999;
    }
  </style>
</head>
<body>
  <ul>
    <li><a href="/memento">Memento</a></li>
  </ul>
</body>
</html>
